<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Gustavo Henrique</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dark-mode">

    <main class="container">
        <button id="toggle-theme">Black</button>

        <section class="perfil">
            <h1 id="meuNome"></h1>
           <p>
    Desenvolvedor de Sistemas • 17 anos
</p>
            <h3 id="tituloProfissional"></h2>
            <p id="minhaBio"></p>
            <p id="anoFormatura"></p>
            <p id="temporRestante"></p>
            <div class="social-buttons">

    <a href="https://github.com/gtzim" target="_blank" class="social-btn github">
        <i class="fab fa-github"></i>
        GitHub
    </a>

   
</div>

        </section>



        <p id="frase"></p>

        <section id="quiz">
            <h2>Descubra seu perfil dev</h2>
            <p>Você prefere trabalhar com...</p>
            <div class="botoes-quiz">
                <button id="btn-visual">🎨 Visual e Design</button>
                <button id="btn-logica">⚙️ Lógica e Dados</button>
            </div>
            <div id="resultado-quiz"></div>
        </section>


        <section id="tecnologias">
            <h2>Tecnologias Favoritas</h2>
            <p>Qual tecnologia você prefere?</p>
            <div class="botoes-tech">
                <button id="btn-java">☕ Java</button>
                <button id="btn-python">🐍 Python</button>
            </div>
            <div id="resultado-tech"></div>
        </section>

        <section id="habilidades">
            <h2>Habilidades</h2>
            <div id="lista-habilidades"></div>
        </section>

  
        <section id="projetos">
            <h2>Projetos</h2>
            <input type="text" id="busca-projeto" placeholder="Buscar por nome ou tecnologia... (ex: Python)">
            <div id="lista-projetos-container"></div>
        </section>


    </main>

    <script src="scripts.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Gustavo Henrique</title>
    <link rel="stylessheet" href="styles/style.css">

</head>

<body>

    <main class="container">

        <section class="perfil">

            <h1 id="meuNome"></h1>

            <h2 id="tituloProfissional"></h2>

            <p id="minhaBio"></p>

            <p id="anoFormatura"></p>

            <p id="temporRestante"></p>

        </section>

        <section id="quiz">

            <h2>Descubra seu perfil dev</h2>

            <p>Você prefere trabalhar com...</p>

            <div class="botoes-quiz">

                <button id="btn-visual">
                    🎨 Visual e Design
                </button>

                <button id="btn-logica">
                    ⚙️ Lógica e Dados
                </button>

            </div>

            <div id="resultado-quiz"></div>

        </section>

        <section id="tecnologias">

            <h2>Tecnologias Favoritas</h2>

            <p>Qual tecnologia você prefere?</p>

            <div class="botoes-tech">

                <button id="btn-java">
                    ☕ Java
                </button>

                <button id="btn-python">
                    🐍 Python
                </button>

            </div>

            <div id="resultado-tech"></div>

        </section>

        <section id="habilidades">

            <h2>Habilidades</h2>

            <div id="lista-habilidades"></div>

        </section>

        <section id="projetos">

            <h2>Projetos</h2>

        </section>

    </main>

    <script src="scripts/scripts.js"></script>

</body>

</html>
